[project]
name = "divinheal-data-platform"
version = "0.1.0"
description = "Standalone source-backed medical tourism data platform for Divinheal"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "notebooks/reference/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"