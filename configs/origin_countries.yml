# -----------------------------------------------------------------------------
# ORIGIN COUNTRY CONFIG
# -----------------------------------------------------------------------------
# PURPOSE:
#   Defines patient/origin countries used by the first multi-destination
#   patient-country profile pipeline.
#
# INPUT:
#   Manually curated origin country list based on current Divinheal planning.
#
# PROCESS:
#   Pipelines can read this file and combine it with configs/destinations.yml
#   to generate origin country × destination country profile rows.
#
# OUTPUT:
#   Origin country metadata for pipeline generation.
#
# NOTES:
#   - This config is intentionally separate from reference schemas.
#   - Reference CSVs are not the source of truth for which countries to process.
#   - Add only stable identity fields here.
#   - Enrichment fields such as population, FX, treatment demand, embassy data,
#     and outbound medical travel should come from source adapters later.
# -----------------------------------------------------------------------------

origin_countries:
  - origin_country_slug: bangladesh
    origin_country_name: Bangladesh
    origin_country_name_local: বাংলাদেশ
    origin_iso_country_code: BD
    origin_primary_locale: bn
    origin_secondary_locales: en
    origin_currency_code: BDT

  - origin_country_slug: ethiopia
    origin_country_name: Ethiopia
    origin_country_name_local: ኢትዮጵያ
    origin_iso_country_code: ET
    origin_primary_locale: am
    origin_secondary_locales: en
    origin_currency_code: ETB

  - origin_country_slug: iraq
    origin_country_name: Iraq
    origin_country_name_local: العراق
    origin_iso_country_code: IQ
    origin_primary_locale: ar
    origin_secondary_locales: ku;en
